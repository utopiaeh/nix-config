name: check

on:
  push:
    branches: [main]
  pull_request:
  # update-flake.yml dispatches this: PRs opened with GITHUB_TOKEN don't trigger pull_request
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check --no-build
      - run: nix run .#scan-keys

  build:
    runs-on: macos-14
    strategy:
      matrix:
        host: [mac-pro, flow48]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix build ".#darwinConfigurations.${{ matrix.host }}.system" --no-link
