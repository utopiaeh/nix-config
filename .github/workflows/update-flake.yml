name: update-flake

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: macos-14
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch check.yml on the PR branch
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake update
      - id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          title: "chore: update flake inputs"
          commit-message: "chore: update flake inputs"
          branch: update-flake-inputs
          delete-branch: true
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run check.yml --ref update-flake-inputs
        env:
          GH_TOKEN: ${{ github.token }}
